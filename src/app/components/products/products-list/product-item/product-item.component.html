<tr *ngIf="product">
  <td>{{product.id}}</td>
  <td>{{product.name}}</td>
  <td>{{product.price}}</td>
  <td>{{product.quantity}}</td>
  <td><span [ngClass]="product.selected?'fa fa-check-circle':'fa fa-lock'" class=""></span></td>
  <td>{{product.available}}</td>
  <td>
    <button class="btn btn-sm btn btn-success" (click)="onSelect(product)" [ngClass]="product.selected?'btn-success':'btn-danger'">
      <span *ngIf="product.selected" >Unselect</span>
      <span *ngIf="!product.selected">Select</span>
    </button>
  </td>
  <td>
    <button class="btn btn-sm btn btn-danger" (click)="onDelete(product)">
    <i class="fa fa-trash"></i>
    </button>
  </td>
  <td>
    <button class="btn btn-sm btn btn-success" (click)="onEdit(product)">
      <i class="fa fa-edit"></i>
    </button>
  </td>
</tr>
